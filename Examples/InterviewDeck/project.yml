# XcodeGen spec for InterviewDeck.xcodeproj. The project file is committed, so XcodeGen is only
# needed after changing this file: run `xcodegen` in this folder.
name: InterviewDeck
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  MobileInterviewQuestions:
    path: ../..
targets:
  InterviewDeck:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: InterviewDeck
      # The app reads the same Markdown files as the command line tool, copied as a folder.
      - path: ../../questions
        type: folder
        buildPhase: resources
    dependencies:
      - package: MobileInterviewQuestions
        product: InterviewBank
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Interview Deck
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Sign to run locally on the Mac; the simulator needs no signing.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  InterviewDeck:
    build:
      targets:
        InterviewDeck: all
    run:
      config: Debug
