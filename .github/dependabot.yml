version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
  # Development dependencies of the answer tests.
  - package-ecosystem: "pub"
    directory: "/answers/flutter"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "test"
    groups:
      pub:
        patterns:
          - "*"
